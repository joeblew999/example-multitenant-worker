[package]
name = "workers-multitenant"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Connor Hindley <conn.hindley@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["http", "d1"] }
worker-macros = { version = "0.8", features = ["http"] }

connectrpc = { version = "0.6", default-features = false }

# Protobuf runtime used by generated code.
buffa = { version = "0.6", features = ["json"] }
buffa-types = { version = "0.6", features = ["json"] }

# Macaroons for every auth artifact (sessions + one-shot tokens).
libmacaroon = { version = "0.2", features = ["wasm"], default-features = false }

# Argon2id password hashing — pure Rust, builds for wasm32.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.5", default-features = false, features = ["alloc", "rand_core"] }
# `OsRng` lives in rand_core under its `getrandom` feature; enable it
# directly so the salt generation path resolves on both wasm32 and native.
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

# UUIDs (v4 for ids and nonces). `js` feature wires getrandom to crypto.getRandomValues
# on wasm32 so the rest of the crate doesn't have to.
uuid = { version = "1", features = ["v4", "serde", "js"] }

base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

url = "2"
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = { version = "1.5", features = ["serde"] }

futures = "0.3"
tower = { version = "0.5", features = ["util"] }

# Cedar policy authz middleware. Path-deps the connectrpc-cedar crate
# inside its workspace so any change here triggers a recompile of both.
# The path moved from "../../" → "../../crates/connectrpc-cedar" when
# the outer repo became a Cargo workspace (see ../../MIDDLEWARES.md for
# the family plan). Once connectrpc-cedar publishes to crates.io, swap.
cedar-policy = "4"
connectrpc-cedar = { path = "../../crates/connectrpc-cedar" }
# Cedar authz on the connectrpc::Interceptor surface (body-aware; runs
# after envelope decode). This worker uses the INTERCEPTOR for cedar +
# metrics now that connectrpc 0.6 ships the Interceptor trait; the Layer
# crates remain for non-connectrpc tower stacks. See ../../MIDDLEWARES.md.
connectrpc-cedar-interceptor = { path = "../../crates/connectrpc-cedar-interceptor" }
# CF-Workers-aware tracing layer (the cf-context family — uses request.cf
# + cf-ray, no CF binding required). See ../../MIDDLEWARES.md.
connectrpc-cf-tracing = { path = "../../crates/connectrpc-cf-tracing" }
# CF Rate Limiting binding wrapper (cf-binding: Rate Limiting). Consumer
# wires env.RL into a `RateLimiter` trait impl.
connectrpc-cf-rate-limit = { path = "../../crates/connectrpc-cf-rate-limit" }
# CF Analytics Engine binding wrapper (cf-binding: Analytics Engine).
# Consumer wires env.AE into a `MetricSink` trait impl.
connectrpc-cf-metrics = { path = "../../crates/connectrpc-cf-metrics" }
# Used by our `RateLimiter` and `MetricSink` impls below. Re-export of
# the crate the middleware crates themselves use, so versions stay aligned.
async-trait = "0.1"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# `getrandom/js` is also needed for any non-libmacaroon dep that pulls in
# OS RNG on wasm32 (uuid via `js`, password-hash for salts). We surface it
# explicitly so a `cargo build --target wasm32-unknown-unknown` from the
# library root works without depending on transitive feature unification.
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
connectrpc-build = { version = "0.6" }

[dev-dependencies]
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
